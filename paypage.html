<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="img/favicon.ico" type="image/x-icon"> 
    <link rel="stylesheet" href="mycss/index.css">
    <link rel="stylesheet" href="mycss/login.css">
    <link rel="stylesheet" href="mycss/sidebar.css">

<body>
    <div class="bg-pay">
      <img src="img/home/home__bg4.jpg" alt="" height="100%" width="100%">
    </div>
    <div class="pay">
     <div class="pay_top">
       <div class="back">
          <a href="paid.html"><i class="fa-solid fa-arrow-left"></i></a>
       </div>
       <div class="paylogo">
          <a href="index.html"><img src="img/logo.svg" alt=""></a>
       </div>
       
     </div>

       <br><br>

    <div class="nxt">
     <div class="total">

     </div>

        <h3>$9.99</h3><h6 style="color: white; ">USD</h6>
     </div>
    </div>
    <br>
     <div class="first_inp">
        <input type="text" name="firstname" id="firstname" placeholder="First Name" required>
        <input type="text" name="lastname" id="lastname" placeholder="Last Name" required>
     </div>
     <br>
     <div class="second_inp">
        <input type="text" name="cardnumber" id="cardnumber" placeholder=" Card Number 0000 0000 0000 0000">

     <br>
     <div class="midd">

        <img src="money/visa.jpg" alt="" height="50px" width="50px">
        <img src="money/master.jpg" alt="" height="50px" width="50px">
        <img src="money/paypal.jpg" alt="" height="50px" width="50px">
        <img src="money/jbc.jpg" alt="" height="50px" width="50px">
     </div>
     <div class="expire">
        <input type="text" name="expire" id="expire" placeholder="MM/YY">
     </div>
     </div>
      <br><br>
     <div class="last">
        <button id="cancel">CANCEL</a></button>
        <button id="submit">SUBMIT</button>
       
     </div>
    </div>
